<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Vocabulary Hub – Relationships</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--card:#ffffff;--ink:#1c2430;--muted:#5b6675;--line:#e2e6ec;--soft:#eef1f5;
  --accent:#b71c1c;--ok:#1b7f3b;--okbg:#e7f6ec;--bad:#c62828;--badbg:#fdecec;--warnbg:#fff7e0;--warn:#8a6100;
  --pio:#2e7d32;--pio-bg:#e8f5e9;--ari:#1565c0;--ari-bg:#e3f2fd;--pho:#6a1b9a;--pho-bg:#f3e5f5;--plc:#b71c1c;--plc-bg:#fdecea;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c;--card:#1b2129;--ink:#e7ebf0;--muted:#9aa5b4;--line:#2c3440;--soft:#232a34;
  --accent:#ef6b6b;--ok:#5fd08a;--okbg:#173524;--bad:#ff7b7b;--badbg:#3a1c1f;--warnbg:#3a3015;--warn:#f0c75e;
  --pio:#6fcf76;--pio-bg:#1b3320;--ari:#6cb2f5;--ari-bg:#172a40;--pho:#c58be0;--pho-bg:#2f1d3a;--plc:#ff8a80;--plc-bg:#3a1f1f;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#12161c;--card:#1b2129;--ink:#e7ebf0;--muted:#9aa5b4;--line:#2c3440;--soft:#232a34;
  --accent:#ef6b6b;--ok:#5fd08a;--okbg:#173524;--bad:#ff7b7b;--badbg:#3a1c1f;--warnbg:#3a3015;--warn:#f0c75e;
  --pio:#6fcf76;--pio-bg:#1b3320;--ari:#6cb2f5;--ari-bg:#172a40;--pho:#c58be0;--pho-bg:#2f1d3a;--plc:#ff8a80;--plc-bg:#3a1f1f;--shadow:none;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:Lexend,system-ui,sans-serif;line-height:1.25;margin:0}
h1{font-size:1.55rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
.mono{font-family:"JetBrains Mono",monospace}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 0 10px}
.eyebrow{font:600 .72rem Lexend,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.title-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:2px 0 10px}
.group-tag{display:inline-flex;align-items:stretch;border-radius:10px;overflow:hidden;font-family:Lexend,sans-serif;box-shadow:0 2px 8px rgba(183,28,28,.25)}
.group-tag .g{background:var(--accent);color:#fff;font-weight:700;font-size:1.25rem;padding:4px 12px;letter-spacing:.04em}
.group-tag .gt{background:#0f5c4d;color:#fff;font-weight:700;font-size:1.05rem;padding:6px 12px;letter-spacing:.08em}
.group-tag .gs{background:var(--soft);color:var(--ink);font-weight:600;font-size:1.05rem;padding:6px 12px}
@media (max-width:760px){.group-tag .g{font-size:1.05rem}.group-tag .gt,.group-tag .gs{font-size:.9rem;padding:5px 9px}}
.chip{display:inline-block;font:600 .75rem Lexend,sans-serif;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.profile{display:grid;grid-template-columns:1.2fr 1.5fr .9fr auto;gap:8px;align-items:end}
.profile label{font-size:.78rem;color:var(--muted);display:block}
input[type=text],input[type=email],select,.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ari);outline-offset:1px}
button{font:600 .92rem "Source Sans 3",sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:.82rem;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.status .ok{color:var(--ok)}.status .bad{color:var(--bad)}
nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav.tabs button{border:none;background:none;border-bottom:3px solid transparent;border-radius:0;padding:8px 12px;color:var(--muted)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:20px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g5{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.sub-card{cursor:pointer;transition:transform .1s}.sub-card:hover{transform:translateY(-2px)}
.sub-card .code{font:600 .75rem "JetBrains Mono";color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:.85rem}.tiny{font-size:.75rem}
.vi{color:var(--pio);font-style:italic}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:10px}.crumbs a{color:var(--muted);cursor:pointer;text-decoration:underline}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.step{flex:1;min-width:150px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:.88rem}
.step b{font-family:Lexend;display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.step.on{outline:2px solid var(--ink)}
.br{border-top:5px solid var(--c);}
.br.pioneer{--c:var(--pio);--cb:var(--pio-bg)}.br.aries{--c:var(--ari);--cb:var(--ari-bg)}.br.phoenix{--c:var(--pho);--cb:var(--pho-bg)}.br.placement{--c:var(--plc);--cb:var(--plc-bg)}
.br .lvl{font:700 .78rem Lexend;color:var(--c);text-transform:uppercase;letter-spacing:.08em}
.br.rec{box-shadow:0 0 0 2px var(--c)}
.badge{display:inline-block;font:600 .72rem Lexend;padding:2px 8px;border-radius:99px;background:var(--cb,var(--soft));color:var(--c,var(--muted))}
.banner{padding:12px 14px;border-radius:10px;margin:10px 0;font-size:.93rem}
.banner.info{background:var(--soft)}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.good{background:var(--okbg);color:var(--ok)}.banner.badb{background:var(--badbg);color:var(--bad)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.word{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.word .w{font:600 1rem Lexend}.word .pos{font:.75rem "JetBrains Mono";color:var(--muted);margin-left:6px}
.word .ex{font-size:.88rem;color:var(--muted);margin-top:4px}
.hide-m .word .mean{filter:blur(5px)}.hide-m .word:hover .mean{filter:none}
.spk{border:none;background:var(--soft);border-radius:99px;padding:2px 8px;font-size:.8rem;margin-left:6px}
.cat-h{font:700 .75rem Lexend;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px}
.ex-list .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ex-list .row:last-child{border-bottom:none}
.ex-list .code{font:600 .8rem "JetBrains Mono";min-width:58px}
.dots{display:inline-flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.f{background:var(--c,var(--ink))}
.q{padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none}
.qn{font:600 .8rem "JetBrains Mono";color:var(--muted);margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;background:var(--card);font-size:.95rem}
.opt input{margin-right:6px}
.opt.sel{border-color:var(--ink);background:var(--soft)}
.q.ok .fb{color:var(--ok)}.q.bad .fb{color:var(--bad)}
.q.ok{background:linear-gradient(90deg,var(--okbg),transparent 60%)}
.q.bad{background:linear-gradient(90deg,var(--badbg),transparent 60%)}
.q.lock .opt,.q.lock select,.q.lock input{pointer-events:none;opacity:.85}
.fb{font-size:.9rem;margin-top:6px}
.hint{font-size:.9rem;margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--warnbg);color:var(--warn)}
.why{font-size:.88rem;color:var(--muted);margin-top:4px}
.sel-inp{max-width:100%;min-width:220px;width:auto}
.txt-inp{max-width:320px}
.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;margin:0 -16px -16px;border-radius:0 0 14px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .sp{flex:1}
.timer{font:600 .9rem "JetBrains Mono"}
.score-big{font:700 2rem Lexend}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:Lexend;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.passage{background:var(--soft);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.97rem;line-height:1.7}.passage h3{margin-bottom:6px}.gapn{font-family:"JetBrains Mono",monospace;color:var(--ari)}
mark.wrongw{background:var(--badbg);color:var(--bad);padding:0 3px;border-radius:4px;text-decoration:line-through}
.tier-h{display:flex;align-items:center;gap:8px;margin:22px 0 6px;padding-top:12px;border-top:2px dashed var(--line)}
.tier-h .badge{font-size:.8rem}
.foot{margin-top:28px;text-align:center;font-size:.68rem;opacity:.55;line-height:1.5}
.cite{text-align:center;font-size:.68rem;opacity:.55;margin-top:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:.92rem;z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.meter{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;background:var(--c,var(--ink))}
@media (max-width:760px){.profile{grid-template-columns:1fr 1fr}.g3,.g2{grid-template-columns:1fr}h1{font-size:1.3rem}.sel-inp{min-width:0;width:100%}}
@media print{header.top,nav,.bar,.no-print{display:none!important}}
</style>
</head>

const BR={pioneer:{name:"Pioneer",band:"IELTS 4–5",lvl:"Elementary – Pre-intermediate",desc:"Core everyday words with Vietnamese support.",vi:"Từ vựng nền tảng, có tiếng Việt."},
          aries:{name:"Aries",band:"IELTS 5.5–6.5",lvl:"Intermediate – Upper-intermediate",desc:"Core: key topic words, collocations, word forms. Extension: upper-intermediate words, prefixes, phrasal verbs and an IELTS reading."},
          phoenix:{name:"Phoenix",band:"IELTS 7+",lvl:"Advanced",desc:"Precise academic words, idioms, phrasal verbs and paraphrase."}};
const ORDER=["pioneer","aries","phoenix"];
const SUBS=Object.fromEntries(DATA.subtopics.map(s=>[s.id,s]));
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- transport ---------- */
const GS=(typeof google!=="undefined"&&google.script&&google.script.run);
let ENDPOINT=CONFIG.ENDPOINT;
try{const h=location.hash.replace("#","");if(/^AKfy[\w-]{20,}$/.test(h)){ENDPOINT="https:\/\/script.google.com/macros/s/"+h+"/exec";LS.set("hsp-endpoint",ENDPOINT);} else if(!ENDPOINT&&LS.get("hsp-endpoint"))ENDPOINT=LS.get("hsp-endpoint");}catch(e){}
const MODE=GS?"sheet":(ENDPOINT?"sheet-remote":"demo");
function api(action,payload){
  payload=Object.assign({token:CONFIG.TOKEN},payload||{});
  if(GS)return new Promise((res,rej)=>google.script.run.withSuccessHandler(r=>{try{res(JSON.parse(r))}catch(e){res(r)}}).withFailureHandler(rej).api(action,JSON.stringify(payload)));
  if(ENDPOINT){
    if(action==="check"||action==="load")return fetch(ENDPOINT+"?action="+action+"&p="+encodeURIComponent(JSON.stringify(payload))).then(r=>r.json());
    return fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action},payload))}).then(r=>r.json());
  }
  if(action==="check"){const ok=CONFIG.DEMO_ALLOW.map(x=>x.toLowerCase()).includes((payload.email||"").toLowerCase());return Promise.resolve({ok:true,allowed:ok,demo:true});}
  return Promise.resolve({ok:true,demo:true});
}

/* ---------- state ---------- */
let S=blankState();
function blankState(){return{owner:"",profile:{name:"",email:"",cls:""},auth:{email:"",allowed:false,at:0},subs:{},outbox:[],updatedAt:0};}
let dirty=false,lastSaved=null,cloudOk=null;
function key(){return "hsp-vocab-"+DATA.slug+":"+(S.owner||"guest");}
function touch(){S.updatedAt=Date.now();dirty=true;}
function subState(id){return S.subs[id]||(S.subs[id]={ex:{},rec:null,chosen:null});}
function exState(subId,code){const ss=subState(subId);return ss.ex[code]||(ss.ex[code]={ans:{},phase:"doing",attempt:1,checks:0,first:null,final:null,firstAns:null,timeMs:0,history:[]});}
function loadLocal(){const last=LS.get("hsp-vocab-"+DATA.slug+":last");if(last&&last.email){const st=LS.get("hsp-vocab-"+DATA.slug+":"+last.email.toLowerCase());if(st)S=Object.assign(blankState(),st);}}
function saveLocal(){LS.set(key(),S);LS.set("hsp-vocab-"+DATA.slug+":last",{email:S.owner});}
async function autosave(){
  if(!dirty&&!S.outbox.length)return;
  if(dirty){saveLocal();}
  let cloud="";
  if(MODE!=="demo"&&S.auth.allowed&&S.profile.email){
    try{
      if(dirty){await api("progress",{topic:DATA.slug,email:S.profile.email,name:S.profile.name,state:JSON.stringify(S)});}
      while(S.outbox.length){const p=S.outbox[0];const r=await api("save",p);if(r&&r.ok===false&&!r.retry){S.outbox.shift();break;}S.outbox.shift();}
      cloud=" + Google Sheet";cloudOk=true;saveLocal();
    }catch(e){cloud=" (cloud offline – will retry)";cloudOk=false;}
  }
  dirty=false;lastSaved=new Date();
  $("#saveStatus").textContent="Autosaved "+lastSaved.toLocaleTimeString()+" · this device"+cloud;
}
setInterval(autosave,CONFIG.AUTOSAVE_MS);
window.addEventListener("pagehide",()=>{if(dirty)saveLocal();});

/* ---------- profile & auth ---------- */
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);}
function readProfile(){S.profile.name=$("#pName").value.trim();S.profile.email=$("#pEmail").value.trim();S.profile.cls=$("#pClass").value;}
function authText(){
  const a=$("#authStatus");
  if(!S.profile.name||!validEmail(S.profile.email)){a.innerHTML="Enter your name and a valid email, then press “Verify email”.";return;}
  if(S.auth.email&&S.auth.email.toLowerCase()===S.profile.email.toLowerCase()){
    const until=S.auth.expires?` Access until ${fmtDate(S.auth.expires)}.`:"";
    a.innerHTML=S.auth.allowed?`<span class="ok">✓ Email verified – autoscoring is on.${until}</span>`
      :S.auth.status==="expired"?`<span class="bad">✗ Your access expired on ${fmtDate(S.auth.expires)}. You can still study the words, but “Check answers” is locked. Please ask your teacher to extend it.</span>`
      :'<span class="bad">✗ This email is not on the class list yet. You can study the words and do the exercises, but “Check answers” is locked. Please ask your teacher.</span>';
  } else a.innerHTML="Press “Verify email” to unlock autoscoring.";
}
async function verify(){
  readProfile();
  if(!S.profile.name){toast("Please enter your name.");return;}
  if(!validEmail(S.profile.email)){toast("Please enter a valid email.");return;}
  // switch to this email's saved progress
  const em=S.profile.email.toLowerCase(),prof={...S.profile};
  if(S.owner!==em){
    if(S.owner)saveLocal();
    const prev=LS.get("hsp-vocab-"+DATA.slug+":"+em);
    if(prev)S=Object.assign(blankState(),prev);
    else if(S.owner)S=blankState();      // another student's work stays under their own email
    S.owner=em;S.profile=prof;
  }
  $("#btnVerify").disabled=true;$("#authStatus").textContent="Checking…";
  try{
    const r=await api("check",{email:S.profile.email,name:S.profile.name});
    S.auth={email:S.profile.email,allowed:!!(r&&r.allowed),status:(r&&r.status)||'',expires:(r&&r.expires)||'',at:Date.now()};
    if(r&&r.cls&&!S.profile.cls){S.profile.cls=r.cls;$("#pClass").value=r.cls;}
    if(S.auth.allowed&&MODE!=="demo"){
      try{const L=await api("load",{topic:DATA.slug,email:S.profile.email});
        if(L&&L.state){const cs=JSON.parse(L.state);if((cs.updatedAt||0)>(S.updatedAt||0)){const p={...S.profile},a={...S.auth},o=S.owner;S=Object.assign(blankState(),cs);S.profile=p;S.auth=a;S.owner=o;toast("Your saved progress was restored from the Google Sheet.");}}
      }catch(e){}
    }
  }catch(e){S.auth={email:S.profile.email,allowed:false,at:Date.now()};toast("Could not reach the Google Sheet. Check your connection and try again.");}
  $("#btnVerify").disabled=false;touch();saveLocal();authText();render();
}
function fmtDate(d){const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(d||'');}
function canCheck(){return S.auth.allowed&&S.auth.email&&S.auth.email.toLowerCase()===S.profile.email.toLowerCase()&&S.profile.name;}

/* ---------- grading ---------- */
function norm(s){return String(s??"").toLowerCase().normalize("NFC").replace(/[’‘`´]/g,"'").replace(/[–—‑]/g,"-").replace(/\b(sth|sb|something|somebody|someone)\b/g,"").replace(/[.,!?;:]+$/,"").replace(/\s+/g," ").trim();}
function isRight(item,ans){
  if(ans==null||ans==="")return false;
  const acc=Array.isArray(item.a)?item.a:[item.a];
  return acc.some(a=>norm(a)===norm(ans));
}
function keyText(item){return Array.isArray(item.a)?item.a.join(" / "):item.a;}

/* ---------- views ---------- */
let VIEW={tab:"topics",sub:null,branch:null,ex:null};
function go(v){Object.assign(VIEW,v);render();window.scrollTo({top:0,behavior:"instant"});}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===VIEW.tab));
  const app=$("#app");
  if(VIEW.tab==="how")app.innerHTML=howView();
  else if(VIEW.tab==="report")app.innerHTML=reportView();
  else if(VIEW.ex)app.innerHTML=exView();
  else if(VIEW.branch)app.innerHTML=branchView();
  else if(VIEW.sub)app.innerHTML=subView();
  else app.innerHTML=homeView();
  footer();
}

    <div class="small muted" style="margin-top:6px">${ORDER.map((b,i)=>`<span class="br ${b}" style="border:none"><span class="dots">${s.branches[b].map((e,j)=>`<i class="${j<done[i]?"f":""}"></i>`).join("")}</span></span> ${BR[b].name}`).join(" &nbsp; ")}</div></div>`}).join("")}</div>`;

function recMessage(s,ss){
  if(!ss.rec)return"";
  const c=S.profile.cls,r=ss.rec,ci=ORDER.indexOf(c),ri=ORDER.indexOf(r);
  let msg=`Recommended branch: <b>${BR[r].name}${r==="aries"&&ss.recTier?(ss.recTier==="extension"?" Extension":" Core"):""}</b> (${BR[r].lvl}).`,cls="info";
  if(c&&ri<ci){msg+=` You are in the ${BR[c].name} class, so review the ${BR[r].name} words first, then move up.`;cls="warn";}
  else if(c&&ri>ci){msg+=` Great result for the ${BR[c].name} class – you are ready to stretch yourself with ${BR[r].name} vocabulary.`;cls="good";}
  else if(c){msg+=` This matches your class level.`;cls="good";}
  if(r==="pioneer")msg+=`<br><span class="vi">Gợi ý: học nhánh Pioneer (từ vựng sơ cấp – tiền trung cấp) trước.</span>`;
  return `<div class="banner ${cls}">${msg}</div>`;
}

function placeBreak(s,pl){const c=levelCounts(s.placement,pl.firstAns||{});return `Pioneer <b class="mono">${c.P}/6</b> · Aries <b class="mono">${c.A}/6</b> · Phoenix <b class="mono">${c.X}/6</b>`;}
function levelCounts(ex,ans){const c={P:0,A:0,X:0};ex.items.forEach((it,i)=>{if(isRight(it,ans[i]))c[it.lvl]++;});return c;}
function recommend(c){const P=CONFIG.PLACE,t=c.P+c.A+c.X;if(c.P+c.A<P.pioneerIfPA_below||c.P<P.pioneerIfP_below)return"pioneer";if(t>=P.phoenixTotal_atLeast&&c.X>=P.phoenixX_atLeast)return"phoenix";return"aries";}
const CATS=["NOUN","VERB","ADJ","ADV","PHRASAL VERB","COLLOCATION","IDIOM"];
function branchView(){
  const s=SUBS[VIEW.sub],b=VIEW.branch,ss=subState(s.id),pio=b==="pioneer";

  const TI=b==="aries"?[["core","Aries Core","The most frequent topic words for IELTS 5.5–6. Start here."],["extension","Aries Extension","Upper-intermediate words, phrasal verbs and an IELTS-style reading. Do these after Core."]]:[[null,"",""]];
  const wordCards=ws=>CATS.map(c=>{const wl=ws.filter(w=>w.cat===c);if(!wl.length)return"";return `<div class="cat-h">${c}</div><div class="words">${wl.map(w=>`<div class="word"><span class="w">${esc(w.w)}</span><span class="pos">${esc(w.pos)}</span><button class="spk" data-say="${esc(w.w.replace(/\b(sth|sb)\b/g,'something'))}" aria-label="Listen">🔊</button>
   <div class="mean small">${esc(w.en)}${pio?`<div class="vi">${esc(w.vi)}</div>`:""}</div><div class="ex">“${esc(w.ex)}”</div></div>`).join("")}</div>`}).join("");
  const exRows=list=>`<div class="ex-list">${list.map(e=>{const st=ss.ex[e.code];const h=st&&st.history||[];const last=h[h.length-1];
    return `<div class="row"><span class="code">${e.code}</span><div style="flex:1;min-width:180px"><b>${esc(e.title)}</b>${pio&&e.title_vi?` <span class="vi small">· ${esc(e.title_vi)}</span>`:""}<div class="small muted">${e.items.length} questions${last?` · first try <b class="mono">${last.first}/${last.total}</b> → final <b class="mono">${last.final}/${last.total}</b> · attempts ${h.length}`:st&&st.phase!=="doing"?" · in progress":""}</div></div>
    <button data-open-ex="${e.code}" class="${!last?"primary":""}">${last?"Review / try again":st&&Object.keys(st.ans).length?"Continue":"Start"}</button></div>`}).join("")}</div>`;
  if(b==="aries"){const core=exs.filter(e=>e.tier==="core").map(e=>ss.ex[e.code]).filter(x=>x&&x.history&&x.history.length);

    <h3 style="margin-top:10px;font-size:.95rem">Learn the words</h3>${wordCards(ws)}<h3 style="margin-top:16px;font-size:.95rem">Practise</h3>${exRows(el)}`}).join("")}</div>

  return `<div class="crumbs"><a data-go-home>${esc(DATA.topic)}</a> › <a data-go-sub="${s.id}">${esc(s.title)}</a> › ${BR[b].name}</div>
  <div class="card br ${b}"><div class="lvl">${BR[b].name} · ${BR[b].band} · ${BR[b].lvl}</div><h2 style="margin-top:4px">${esc(s.title)}${pio?` <span class="vi small">· ${esc(s.title_vi)}</span>`:""}</h2>
  ${advice}
  <h3 style="margin-top:14px">1 · Learn the words <span class="small muted">(${words.length})</span></h3>
  <div class="small muted" style="margin:4px 0 6px"><label><input type="checkbox" id="hideM"> Hide meanings to test yourself${pio?" · <span class='vi'>Ẩn nghĩa để tự kiểm tra</span>":""}</label></div>

function findEx(s,code){if(s.placement.code===code)return s.placement;for(const b of ORDER){const e=s.branches[b].find(x=>x.code===code);if(e)return Object.assign({branch:b},e);}return null;}
function exView(){
  const s=SUBS[VIEW.sub],e=findEx(s,VIEW.ex),st=exState(s.id,e.code);
  const b=e.branch||"placement",pio=b==="pioneer"||b==="placement";
  const phase=st.phase,showRes=phase==="done";
  const items=e.items.map((it,i)=>qHtml(e,it,i,st,pio)).join("");
  const n=e.items.length;
  let head="";
  if(phase==="retry")head=`<div class="banner warn">First check: <b class="mono">${st.first}/${n}</b>. Wrong answers are marked with a hint – correct them and press <b>Check again</b>. This is your last try before the answers are shown.${pio?`<br><span class="vi">Câu sai có gợi ý – sửa lại và bấm “Check again”. Đây là lần làm lại cuối trước khi hiện đáp án.</span>`:""}</div>`;
  if(showRes){const last=st.history[st.history.length-1]||{};head=`<div class="banner ${st.final/n>=.7?"good":"info"}"><div class="score-big">${st.final}/${n}</div>First try <b class="mono">${st.first}/${n}</b> · after hints <b class="mono">${st.final}/${n}</b> · attempt ${st.attempt} · time ${fmtTime(last.timeMs||st.timeMs)}${e.lvls?`<br>${placeBreak(s,st)} → recommended branch: <b>${BR[subState(s.id).rec].name}</b>`:""}</div>`;}

  ${e.passage?`<div class="passage"><h3>${esc(e.ptitle||"")}</h3>${esc(e.passage).replace(/\((\d+)\)[ \t]*_*/g,'<b class="gapn">($1) ______</b>')}</div>`:""}
  ${head}
  ${locked&&!showRes?`<div class="banner badb small">Autoscoring is available only for verified class emails. Enter your name and email at the top and press “Verify email”.${pio?`<br><span class="vi">Chỉ email đã đăng ký mới được chấm điểm tự động.</span>`:""}</div>`:""}
  <div id="qs">${items}</div>
  <div class="bar">
   <span class="timer" id="timer">⏱ ${fmtTime(st.timeMs)}</span><span class="small muted">Attempt ${st.attempt} · checks ${st.checks}/2</span><span class="sp"></span>
   ${showRes?`<button data-download="${e.code}">Download result</button><button data-retake="${e.code}">Try again</button>${e.lvls?`<button class="primary" data-open-branch="${subState(s.id).rec}">Go to ${BR[subState(s.id).rec].name}</button>`:`<button class="primary" data-next>Next exercise</button>`}`
     :`<button class="primary" id="btnCheck" ${locked?"disabled":""}>${phase==="retry"?"Check again (last try)":"Check answers"}</button>`}
  </div></div>`;
}
function qHtml(e,it,i,st,pio){
  const ph=st.phase,ans=st.ans[i]??"";
  const firstOk=st.firstAns?isRight(it,st.firstAns[i]):null,nowOk=isRight(it,ans);
  let cls="",lock=false,fb="";
  if(ph==="retry"){if(firstOk){cls="ok lock";lock=true;fb=`<div class="fb">✓ Correct</div>`;}else{cls="bad";fb=`<div class="hint">💡 ${esc(it.hint)}${pio&&it.hint_vi?`<br><span>${esc(it.hint_vi)}</span>`:""}</div>`;}}
  if(ph==="done"){lock=true;cls=(nowOk?"ok":"bad")+" lock";
    fb=`<div class="fb">${nowOk?"✓":"✗"} ${!nowOk?`Answer: <b>${esc(keyText(it))}</b>`:"Correct"}${st.firstAns&&!firstOk&&nowOk?" <span class='muted small'>(corrected after hint)</span>":""}</div><div class="why">${esc(it.why)}${pio&&it.why_vi?`<br><span class="vi">${esc(it.why_vi)}</span>`:""}</div>`;}
  let q=esc(it.q).replace("____",`<span class="mono">______</span>`);
  if(it.mark)q=q.replace(esc(it.mark),`<mark class="wrongw">${esc(it.mark)}</mark>`);
  const ctlType=it.ctl||(e.type==="mcq"?"radio":e.type==="select"?"select":"text");
  const opts=it.opts||e.opts;
  let ctl="";
  if(ctlType==="radio")ctl=`<div class="opts" role="radiogroup">${it.o.map(o=>`<label class="opt ${ans===o?"sel":""}"><input type="radio" name="q${i}" value="${esc(o)}" ${ans===o?"checked":""} ${lock?"disabled":""} data-q="${i}">${esc(o)}</label>`).join("")}</div>`;
  else if(ctlType==="select")ctl=`<div style="margin-top:8px"><select class="sel-inp" data-q="${i}" ${lock?"disabled":""}><option value="">— choose —</option>${opts.map(o=>`<option ${ans===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
  else ctl=`<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${it.base?`<span class="mono small">${esc(it.base)}</span>`:""}${it.cue?`<span class="mono small">${esc(it.cue)}</span>`:""}<input type="text" class="inp txt-inp" data-q="${i}" value="${esc(ans)}" ${lock?"disabled":""} autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
  return `<div class="q ${cls}"><span class="qn">${i+1}</span>${q}${pio&&it.q_vi?` <details class="small vi" style="display:inline"><summary style="display:inline;cursor:pointer">Tiếng Việt</summary> ${esc(it.q_vi)}</details>`:""}${ctl}${fb}</div>`;
}
function fmtTime(ms){ms=ms||0;const s=Math.round(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}

/* ---------- actions ---------- */
function curEx(){const s=SUBS[VIEW.sub];return{s,e:findEx(s,VIEW.ex),st:exState(s.id,VIEW.ex)};}
function score(e,ans){return e.items.reduce((a,it,i)=>a+(isRight(it,ans[i])?1:0),0);}
function check(){
  if(!canCheck()){toast("Autoscoring is locked: verify a class email first.");return;}
  const {s,e,st}=curEx();const n=e.items.length;
  const blanks=e.items.filter((_,i)=>!st.ans[i]).length;
  if(blanks&&!st._warned){st._warned=true;toast(`${blanks} question(s) are blank. Press Check again to submit anyway.`);return;}
  st._warned=false;
  if(st.phase==="doing"){
    st.firstAns={...st.ans};st.first=score(e,st.ans);st.checks=1;
    if(e.lvls&&(st.attempt===1||!subState(s.id).rec)){const c=levelCounts(e,st.firstAns);const ss=subState(s.id);ss.rec=recommend(c);ss.placeCounts=c;ss.recTier=ss.rec==='aries'?(c.A>=CONFIG.PLACE.ariesExtA_atLeast&&c.X>=CONFIG.PLACE.ariesExtX_atLeast?'extension':'core'):null;}
    if(st.first===n){st.final=n;finish(s,e,st);}else{st.phase="retry";}
  } else if(st.phase==="retry"){st.final=score(e,st.ans);st.checks=2;finish(s,e,st);}
  touch();render();window.scrollTo({top:0,behavior:"smooth"});
}
function finish(s,e,st){
  st.phase="done";const n=e.items.length;
  const rec={attempt:st.attempt,first:st.first,final:st.final,total:n,firstPct:Math.round(st.first/n*100),finalPct:Math.round(st.final/n*100),timeMs:st.timeMs,checks:st.checks,at:new Date().toISOString()};
  st.history.push(rec);
  const ss=subState(s.id);
  const payload={name:S.profile.name,email:S.profile.email,cls:S.profile.cls,topic:DATA.topic,subId:s.id,subTitle:s.title,branch:e.branch||"placement",code:e.code,title:e.title,
    attempt:st.attempt,first:st.first,final:st.final,total:n,checks:st.checks,timeMin:+(st.timeMs/60000).toFixed(2),
    rec:e.lvls?ss.rec:"",levels:e.lvls?ss.placeCounts:null,device:navigator.userAgent.slice(0,90),
    items:e.items.map((it,i)=>({q:it.q.slice(0,140),first:st.firstAns?st.firstAns[i]||"":"",final:st.ans[i]||"",key:keyText(it),firstOk:st.firstAns?isRight(it,st.firstAns[i]):isRight(it,st.ans[i]),finalOk:isRight(it,st.ans[i]),lvl:it.lvl||""}))};
  S.outbox.push(payload);dirty=true;autosave();
  toast(MODE==="demo"?"Result saved on this device (demo mode – not connected to Google Sheet).":"Result sent to your teacher.");
}
function retake(code){const {s,e}=curEx();const st=exState(s.id,code);Object.assign(st,{ans:{},phase:"doing",attempt:st.attempt+1,checks:0,first:null,final:null,firstAns:null,timeMs:0});touch();render();}
function nextEx(){const {s,e}=curEx();const list=s.branches[e.branch];const i=list.findIndex(x=>x.code===e.code);if(i<list.length-1)go({ex:list[i+1].code});else go({ex:null});}

/* timer: counts active time while an exercise is open, visible and not finished */
setInterval(()=>{if(VIEW.tab!=="topics"||!VIEW.ex||document.visibilityState!=="visible")return;const {st}=curEx();if(st.phase==="done")return;st.timeMs+=1000;dirty=true;const t=$("#timer");if(t)t.textContent="⏱ "+fmtTime(st.timeMs);},1000);

/* ---------- report ---------- */
function rows(){const out=[];DATA.subtopics.forEach(s=>{const ss=S.subs[s.id];if(!ss)return;[s.placement,...ORDER.flatMap(b=>s.branches[b].map(e=>Object.assign({branch:b},e)))].forEach(e=>{const st=ss.ex[e.code];if(!st||!st.history.length)return;const h=st.history,l=h[h.length-1];out.push({s,e,ss,first:h[0],last:l,attempts:h.length,time:h.reduce((a,x)=>a+x.timeMs,0)});});});return out;}
function reportView(){
  const R=rows();
  return `<div class="card" id="reportCard"><div class="eyebrow">Huong Stella Paradigm · English Vocabulary Hub</div><h2 style="margin:4px 0">My report – ${esc(DATA.topic)}</h2>
  <p class="small">Name: <b>${esc(S.profile.name||"—")}</b> · Email: <b>${esc(S.profile.email||"—")}</b> · Class: <b>${clsName(S.profile.cls)}</b> · Date: ${new Date().toLocaleString()}</p>
  <h3 style="margin-top:12px">Placement results</h3>
  <table><tr><th>Subtopic</th><th>First score</th><th>Pioneer / Aries / Phoenix</th><th>Recommended</th><th>Branch studied</th></tr>
  ${DATA.subtopics.map(s=>{const ss=S.subs[s.id]||{};const pl=(ss.ex||{})[s.placement.code];const c=ss.placeCounts;return `<tr><td>${s.id} · ${esc(s.title)}</td><td class="mono">${pl&&pl.first!=null?pl.history[0]?.first+"/18":"—"}</td><td class="mono">${c?`${c.P} / ${c.A} / ${c.X}`:"—"}</td><td>${clsName(ss.rec)}</td><td>${clsName(ss.chosen)}</td></tr>`}).join("")}</table>
  <h3 style="margin-top:14px">Exercises</h3>
  ${R.length?`<table><tr><th>Code</th><th>Exercise</th><th>Branch</th><th>First try</th><th>Latest (after hint)</th><th>Attempts</th><th>Total time</th></tr>${R.map(r=>`<tr><td class="mono">${r.e.code}</td><td>${esc(r.s.title)} – ${esc(r.e.title)}</td><td>${r.e.branch?BR[r.e.branch].name:"Placement"}</td><td class="mono">${r.first.first}/${r.first.total} (${r.first.firstPct}%)</td><td class="mono">${r.last.final}/${r.last.total}</td><td class="mono">${r.attempts}</td><td class="mono">${fmtTime(r.time)}</td></tr>`).join("")}</table>`:`<p class="muted small">No finished exercises yet.</p>`}
  <p class="small muted" style="margin-top:10px">Download the PDF result report and send it to your teacher.</p>
  <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" data-download="ALL">Download PDF report</button><button data-download-html>Download as web page</button></div></div>`;
}
function howView(){
  return `<div class="card"><h2>How it works</h2>
  <ol style="padding-left:1.2em">
  <li><b>Sign in.</b> Type your name and email and press “Verify email”. Only emails on your teacher’s class list can use <b>Check answers</b> (autoscoring). <span class="vi">Chỉ email trong danh sách lớp mới được chấm tự động.</span></li>
  <li><b>Placement test (each subtopic).</b> 18 questions at three levels. Your first check recommends a branch: <b>Pioneer</b> (IELTS 4–5), <b>Aries</b> (5.5–6.5) or <b>Phoenix</b> (7+). You may still open any branch.</li>
  <li><b>Learn the words.</b> Listen 🔊, read the example, then hide the meanings to test yourself.</li>
  <li><b>Practise.</b> Press <b>Check answers</b>. Wrong answers get a hint and you have <b>one more try</b>. Then the answers and explanations are shown. <span class="vi">Sai sẽ có gợi ý và được làm lại 1 lần trước khi hiện đáp án.</span></li>
  <li><b>We record</b> your first-try score, final score, number of attempts and time on task. Your work is autosaved every 10 seconds.</li>
  <li><b>Move up or down.</b> After 3 exercises in a branch: first-try average ≥ ${CONFIG.MOVE.up}% → try the next branch; below ${CONFIG.MOVE.down}% → review the branch below.</li>
  <li><b>Report.</b> Open “My report” to download your results.</li></ol></div>`;
}
async function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function downloadPDF(code){
  let html;
  if(code==="ALL"){html=$("#reportCard").outerHTML;}
  else{const {s,e,st}=curEx();const l=st.history[st.history.length-1];
    html=`<div class="card"><div class="eyebrow">Huong Stella Paradigm · English Vocabulary Hub</div><h2>${e.code} · ${esc(e.title)}</h2><p class="small">${esc(S.profile.name)} · ${esc(S.profile.email)} · ${esc(s.title)} · ${e.branch?BR[e.branch].name:"Placement test"} · ${new Date().toLocaleString()}</p>
    <p>First try <b>${l.first}/${l.total}</b> · Final <b>${l.final}/${l.total}</b> · Attempt ${l.attempt} · Time ${fmtTime(l.timeMs)}${e.lvls?` · Recommended: <b>${BR[subState(s.id).rec].name}</b>`:""}</p>
    <table><tr><th>#</th><th>Question</th><th>First answer</th><th>Final answer</th><th>Key</th></tr>${e.items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.q)}</td><td>${esc(st.firstAns?st.firstAns[i]||"":"")} ${st.firstAns?(isRight(it,st.firstAns[i])?"✓":"✗"):""}</td><td>${esc(st.ans[i]||"")} ${isRight(it,st.ans[i])?"✓":"✗"}</td><td>${esc(keyText(it))}</td></tr>`).join("")}</table></div>`;}
  const box=document.createElement("div");box.style.cssText="position:fixed;left:-10000px;top:0;width:900px;background:#fff;color:#111;padding:20px";box.setAttribute("data-theme","light");box.innerHTML=html;document.body.appendChild(box);
  const fname=`VocabHub_${(S.profile.name||"student").replace(/\s+/g,"_")}_${code}.pdf`;
  try{
    if(!window.html2canvas)await loadScript("https:\/\/cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    if(!window.jspdf)await loadScript("https:\/\/cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const canvas=await html2canvas(box,{scale:2,backgroundColor:"#ffffff"});
    const pdf=new jspdf.jsPDF({unit:"pt",format:"a4"});const pw=pdf.internal.pageSize.getWidth()-48,ph=pdf.internal.pageSize.getHeight()-48;
    const imgH=canvas.height*pw/canvas.width;let y=0;
    while(y<imgH){if(y>0)pdf.addPage();pdf.addImage(canvas.toDataURL("image/jpeg",.92),"JPEG",24,24-y,pw,imgH);y+=ph;}
    pdf.save(fname);
  }catch(err){downloadHTML(html,fname.replace(".pdf",".html"));}
  box.remove();
}
function downloadHTML(inner,fname){
  const css=document.querySelector("style").textContent;
  const doc=`<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>${esc(fname)}</title><style>${css}</style></head><body><div class="wrap" style="padding:20px">${inner}</div></body></html>`;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([doc],{type:"text/html"}));a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ---------- speech (device TTS, female British voice preferred) ---------- */
let VOICE=null;
function pickVoice(){const vs=speechSynthesis.getVoices();const rank=["Sonia","Libby","Maisie","Hollie","Google UK English Female","Serena","Kate","Stephanie","Martha","Hazel","Susan"];
  for(const r of rank){const v=vs.find(v=>v.name.includes(r));if(v)return v;}return vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang.startsWith("en"))||null;}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=()=>{VOICE=pickVoice();};VOICE=pickVoice();}
function say(t){if(!("speechSynthesis" in window))return toast("Speech is not supported on this device.");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u);}

/* ---------- misc ---------- */
let tt;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);}t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",3800);}
function footer(){
  const all=[...new Set(DATA.subtopics.flatMap(s=>ORDER.flatMap(b=>s.src[b].map(x=>x.split(" – ")[0]))))];
  $("#foot").innerHTML=`Adapted from: ${all.map(esc).join("; ")}. All original texts remain the copyright of their respective publishers.<br>Compiled, adapted and developed by Huong Stella Learning Lab · Contact: huongstella8@gmail.com`;
}
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-go-sub],[data-go-home],[data-open-branch],[data-open-ex],[data-retake],[data-next],[data-download],[data-download-html],[data-say],[data-tab],#btnCheck,#btnVerify");
  if(!t)return;
  if(t.dataset.tab){go({tab:t.dataset.tab});return;}
  if(t.id==="btnVerify")return verify();
  if(t.id==="btnCheck")return check();
  if(t.hasAttribute("data-go-home"))return go({tab:"topics",sub:null,branch:null,ex:null});
  if(t.dataset.goSub)return go({tab:"topics",sub:t.dataset.goSub,branch:null,ex:null});
  if(t.dataset.openBranch)return go({tab:"topics",branch:t.dataset.openBranch,ex:null});
  if(t.dataset.openEx){const s=SUBS[VIEW.sub];const e=findEx(s,t.dataset.openEx);return go({tab:"topics",ex:t.dataset.openEx,branch:e.branch||VIEW.branch});}
  if(t.dataset.retake)return retake(t.dataset.retake);
  if(t.hasAttribute("data-next"))return nextEx();
  if(t.dataset.download)return downloadPDF(t.dataset.download);
  if(t.hasAttribute("data-download-html"))return downloadHTML($("#reportCard").outerHTML,`VocabHub_${(S.profile.name||"student").replace(/\s+/g,"_")}_report.html`);
  if(t.dataset.say)return say(t.dataset.say);
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="hideM"){$("#wordsBox").classList.toggle("hide-m",t.checked);return;}
  if(t.id==="pClass"){S.profile.cls=t.value;touch();render();return;}
  if(t.dataset.q!=null&&VIEW.ex){const {st}=curEx();st.ans[t.dataset.q]=t.value;touch();if(t.type==="radio"){t.closest(".opts").querySelectorAll(".opt").forEach(l=>l.classList.toggle("sel",l.contains(t)));}}
});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset.q!=null&&t.type==="text"&&VIEW.ex){const {st}=curEx();st.ans[t.dataset.q]=t.value;touch();}
  if(t.id==="pName"||t.id==="pEmail"){readProfile();touch();authText();}});
/* init */
loadLocal();
$("#pName").value=S.profile.name||"";$("#pEmail").value=S.profile.email||"";$("#pClass").value=S.profile.cls||"";
$("#modeChip").textContent=MODE==="demo"?"Offline demo":"Connected";
authText();render();
/* re-check access (expiry may have passed or been extended) when the last check is older than 6 hours */
(async()=>{if(MODE==="demo"||!S.auth||!S.auth.email||Date.now()-(S.auth.at||0)<6*3600e3)return;
  try{const r=await api("check",{email:S.auth.email,name:S.profile.name});if(r&&r.ok!==false){Object.assign(S.auth,{allowed:!!r.allowed,status:r.status||"",expires:r.expires||"",at:Date.now()});touch();saveLocal();authText();render();}}catch(e){}})();
</script>
